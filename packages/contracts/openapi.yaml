openapi: 3.1.0
info: { title: LedgerLens API, version: 0.1.0, description: Read-only finance analysis. No endpoint writes to any ERP or ledger. }
servers: [{ url: /api/v1 }]
components:
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8 } }
  schemas:
    ErrorCode:
      type: string
      enum: [UNAUTHORIZED_SCOPE, AMBIGUOUS_PERIOD, UNRECONCILED_SOURCE, MISSING_FX_RATE, STALE_SNAPSHOT, INVALID_AMOUNT, MIXED_CURRENCY, UNSUPPORTED_QUERY]
    Error:
      type: object
      required: [code, message]
      properties: { code: { $ref: '#/components/schemas/ErrorCode' }, message: { type: string }, clarification: { type: string } }
    QueryAst:
      type: object
      required: [metric, aggregation, period, entity_ids]
      properties:
        metric: { type: string, description: Allowlisted canonical metric ID (locale-independent) }
        aggregation: { type: string, enum: [sum] }
        period: { type: object, required: [from, to], properties: { from: { type: string, pattern: '^\d{4}-\d{2}$' }, to: { type: string, pattern: '^\d{4}-\d{2}$' } } }
        entity_ids: { type: array, items: { type: string }, minItems: 1 }
        group_by: { type: array, items: { type: string } }
        compare_to: { type: object, properties: { kind: { type: string, enum: [budget, forecast] }, version_id: { type: string } } }
        filters: { type: object }
    MetricResult:
      type: object
      required: [result_id, metric_id, value_decimal, unit, currency, entity_ids, period_start, period_end, filters, source_snapshot_ids, mapping_version, formula_id, lineage_ref, as_of, reconciliation_state]
      properties:
        result_id: { type: string }
        metric_id: { type: string }
        value_decimal: { type: string, description: Decimal as string, never a float }
        unit: { type: string }
        currency: { type: string }
        entity_ids: { type: array, items: { type: string } }
        period_start: { type: string }
        period_end: { type: string }
        filters: { type: object }
        source_snapshot_ids: { type: array, items: { type: string } }
        plan_version_id: { type: string }
        mapping_version: { type: string }
        fx_policy_version: { type: string }
        formula_id: { type: string }
        lineage_ref: { type: string }
        as_of: { type: string, format: date-time }
        reconciliation_state: { type: string, enum: [reconciled, unreconciled] }
  responses:
    Err: { description: Typed error, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
paths:
  /imports:
    post: { summary: Upload actuals or plan file, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '202': { description: Accepted }, default: { $ref: '#/components/responses/Err' } } }
  /imports/{id}/validation:
    get: { summary: Validation and rejection report, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, default: { $ref: '#/components/responses/Err' } } }
  /imports/{id}/publish:
    post: { summary: Publish immutable snapshot (finance-admin only; blocked unless all gates pass), parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Published }, '409': { $ref: '#/components/responses/Err' } } }
  /dimensions:
    get: { summary: Authorized dimensions and metrics, both language labels, responses: { '200': { description: OK } } }
  /analysis/query:
    post:
      summary: Run a validated typed query. The server rejects anything outside the allowlist.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/QueryAst' } } } }
      responses:
        '200': { description: Results, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MetricResult' } } } } }
        default: { $ref: '#/components/responses/Err' }
  /analysis/{id}/evidence:
    get: { summary: Source rows behind a result, or an opaque evidence token if rows are restricted, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Err' } } }
  /close/{period}/tasks:
    get: { summary: List close tasks, parameters: [{ name: period, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
    post: { summary: Update own task status/evidence metadata, parameters: [{ name: period, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /close/{period}/ready:
    post: { summary: Controller declares close ready (fails if any gate is open), parameters: [{ name: period, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK }, '409': { $ref: '#/components/responses/Err' } } }
  /close/{period}/summary-draft:
    post: { summary: Draft close summary from cited result IDs, parameters: [{ name: period, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Draft } } }
  /approvals/{id}/approve:
    post: { summary: Approve an exact artifact hash for a named destination, parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: Approved }, '409': { description: Artifact changed since request } } }
  /scenarios:
    post: { summary: Create isolated hypothetical scenario, parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created } } }
  /scenarios/{id}/calculate:
    post: { summary: Deterministic scenario calculation, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /audit:
    get: { summary: Audit trail for an object (includes denied attempts), parameters: [{ name: object_id, in: query, schema: { type: string } }], responses: { '200': { description: OK } } }
