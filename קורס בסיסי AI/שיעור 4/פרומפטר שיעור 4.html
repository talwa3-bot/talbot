<style>
/* Layout: one dark stage, a fixed reading line at 38% height, text column scrolls up under it; status bar on top, controls at bottom. Single dark theme by choice (prompter convention). */
:root{
  --bg:#0B0F17;

  --accent:#487CFF;

  --dir:#E6B85C;

  --warn:#F2A93B;

  --f-body:"Assistant","Arial Hebrew","Segoe UI",Arial,sans-serif;

  --fs:44px;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
.app{position:relative;height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--border);font-family:var(--f-ui);z-index:5}
.slideno{font-weight:700;color:var(--accent-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.slidetitle{font-weight:500;min-width:0;flex:1 1 200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timers{display:flex;gap:14px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px;white-space:nowrap}
.timers b{color:var(--ink);font-weight:700}
.timers .over b{color:var(--warn)}
.state{font-size:13px;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.state.on{background:rgba(62,207,142,.15);color:var(--ok)}
.viewport{position:relative;flex:1;overflow:hidden;background:var(--stage)}
.viewport.mirror .scroller{transform:scaleX(-1)}
.scroller{position:absolute;inset:0;overflow-y:scroll;scrollbar-width:none;padding-inline:16px}
.scroller::-webkit-scrollbar{display:none}
.readline{position:absolute;left:0;right:0;top:38%;height:calc(var(--fs) * 1.9);transform:translateY(-35%);background:var(--line);border-block:1px solid rgba(72,124,255,.35);pointer-events:none;z-index:2}
.readline::before{content:"";position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);border:12px solid transparent;border-inline-start-color:var(--accent)}
.fade{position:absolute;left:0;right:0;pointer-events:none;z-index:3}
.fade.top{top:0;height:18%;background:linear-gradient(var(--stage),transparent)}
.fade.bot{bottom:0;height:22%;background:linear-gradient(transparent,var(--stage))}
.text{max-width:min(28em,100%);margin:0 auto;padding-top:38vh;padding-bottom:60vh;font-size:var(--fs);line-height:1.5}
.slide{padding-block:.6em 1.2em;border-top:1px dashed var(--border)}
.slide:first-child{border-top:0}
.head{display:flex;align-items:baseline;gap:.5em;flex-wrap:wrap;font-family:var(--f-ui);font-size:.62em;color:var(--accent-soft);margin-bottom:.4em}
.head .num{font-weight:700;font-variant-numeric:tabular-nums}
.head .ttl{color:var(--ink);font-weight:700;text-wrap:balance}
.head .min{color:var(--muted);font-weight:500;font-size:.75em}
.meta{font-size:.42em;line-height:1.5;color:var(--muted);margin:.2em 0 .6em;max-width:48ch}
.meta b{color:var(--ink);font-weight:700}
.say{margin:0 0 .55em;font-weight:600}
.dir{margin:0 0 .6em;font-size:.6em;font-style:italic;color:var(--dir)}
.dir::before{content:"◆ ";font-style:normal;font-size:.8em}
.quiz{display:inline-block;margin:.1em 0 .7em;font-family:var(--f-ui);font-size:.45em;padding:.35em .8em;border-radius:999px;background:rgba(72,124,255,.18);color:var(--accent-soft);border:1px solid rgba(72,124,255,.4)}
.next{margin:.4em 0 0;font-size:.62em;color:var(--accent-soft)}
.next::before{content:"מעבר ← ";font-family:var(--f-ui);font-size:.75em;color:var(--muted)}
.end{text-align:center;color:var(--muted);font-family:var(--f-ui);font-size:.6em;padding-top:2em}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--border);z-index:5}
.controls button{font-family:var(--f-ui);font-size:15px;color:var(--ink);background:var(--chip);border:1px solid var(--border);border-radius:10px;padding:8px 12px;cursor:pointer;min-width:44px;display:inline-flex;align-items:center;gap:6px}
.controls button:hover{border-color:var(--accent)}
.controls button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls .play{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;min-width:110px;justify-content:center}
.controls kbd{font-family:var(--f-ui);font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.controls .play kbd{color:#dfe7ff;border-color:rgba(255,255,255,.4)}

.hint{position:absolute;inset:auto 0 26% 0;margin:auto;width:fit-content;max-width:calc(100% - 32px);z-index:4;background:rgba(14,20,32,.92);border:1px solid var(--border);border-radius:14px;padding:14px 20px;font-family:var(--f-ui);font-size:16px;color:var(--muted);text-align:center;line-height:1.7}
.hint b{color:var(--ink)}
.hint kbd{font-family:var(--f-ui);color:var(--ink);border:1px solid var(--border);border-radius:5px;padding:1px 6px;margin-inline:2px}
.index{position:absolute;inset-block:0;inset-inline-end:0;width:min(340px,90%);background:var(--bg);border-inline-start:1px solid var(--border);z-index:6;overflow-y:auto;padding:12px}
.index button{display:flex;width:100%;gap:10px;text-align:start;background:none;border:0;border-radius:8px;color:var(--ink);font-family:var(--f-ui);font-size:15px;padding:8px 10px;cursor:pointer}
.index button:hover,.index button.cur{background:var(--chip)}
.index .n{color:var(--accent-soft);font-variant-numeric:tabular-nums;min-width:2ch}
@media (max-width:600px){:root{--fs:30px}.timers{font-size:13px}.controls button{padding:7px 9px;font-size:14px}.controls kbd{display:none}}
@media (prefers-reduced-motion:reduce){.scroller{scroll-behavior:auto}}
</style>

const $ = id => document.getElementById(id);
const scroller = $("scroller"), textEl = $("text");

let speed = store.get("speed", 4);      // 1..12
let fs = store.get("fs", window.innerWidth < 600 ? 30 : 44);
let playing = false, mirror = false, started = false, navUntil = 0;
let lastT = null, acc = 0;
let current = -1, slideStart = 0, slideAcc = 0, totalAcc = 0;

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };

// build text
textEl.innerHTML = DATA.map((d,i) => {
  let h = `<section class="slide" id="s${d.n}" data-i="${i}">
    <div class="head"><span class="num">שקופית ${d.n}</span><span class="ttl">${esc(d.t)}</span><span class="min">${d.min} דק'</span></div>
    <p class="meta"><b>מטרה:</b> ${esc(d.goal)}${d.prep ? `<br><b>הכנה:</b> ${esc(d.prep)}` : ""}</p>`;
  d.lines.forEach(l => { h += l.k === "dir" ? `<p class="dir">${esc(l.t)}</p>` : `<p class="say">${esc(l.t)}</p>`; });
  if (d.game) h += `<span class="quiz">🏆 ${esc(d.game)}</span>`;
  if (d.do) h += `<p class="dir">${esc(d.do)}</p>`;
  h += `<p class="next">${esc(d.next)}</p></section>`;
  return h;
}).join("") + `<p class="end">סוף המפגש · תודה 💙</p>`;

$("index").innerHTML = DATA.map((d,i) => `<button data-i="${i}"><span class="n">${d.n}</span><span>${esc(d.t)}</span></button>`).join("");
const sections = [...textEl.querySelectorAll(".slide")];

function applyFs(){ document.documentElement.style.setProperty("--fs", fs+"px"); readout(); }
function readout(){ $("readout").textContent = `מהירות ${speed} · אות ${fs}`; }
function setPlaying(p){
  playing = p; lastT = null; if (p) started = true;
  $("state").textContent = p ? "רץ" : "מושהה";
  $("state").classList.toggle("on", p);
  $("bPlay").innerHTML = (p ? "⏸ עצירה" : "▶ הפעלה") + " <kbd>רווח</kbd>";
  if (p) $("hint").hidden = true;

  if (performance.now() < navUntil) return;
  const y = readY(); let idx = 0;
  for (let i=0;i<sections.length;i++){ if (sections[i].offsetTop <= y) idx = i; else break; }

function setCurrent(idx){
  if (idx !== current){
    current = idx; slideAcc = 0;
    const d = DATA[idx];
    $("slideno").textContent = `${d.n}/${DATA.length}`;
    $("slidetitle").textContent = d.t;
    document.querySelectorAll(".index button").forEach(b => b.classList.toggle("cur", +b.dataset.i === idx));
  }
}
function tick(t){
  if (lastT == null) lastT = t;
  const dt = Math.min(0.1, (t - lastT)/1000); lastT = t;
  if (playing){
    // pixels per second scale with font size so a speed level means similar reading pace at any size
    acc += speed * fs * 0.075 * dt;
    if (acc >= 1){ const px = Math.floor(acc); acc -= px; scroller.scrollTop += px; }
    if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 2) setPlaying(false);
  }
  if (started){ slideAcc += dt; totalAcc += dt; }
  detect();
  const plan = DATA[current] ? DATA[current].min*60 : 0;
  const st = $("slideTimer");
  st.innerHTML = `בשקופית <b>${fmt(slideAcc)}</b> / ${fmt(plan)}`;
  st.classList.toggle("over", slideAcc > plan);
  $("totalTimer").textContent = fmt(totalAcc);
  requestAnimationFrame(tick);

function faster(d){ speed = Math.max(1, Math.min(12, speed + d)); store.set("speed", speed); readout(); }
function bigger(d){ fs = Math.max(20, Math.min(90, fs + d)); store.set("fs", fs); const i = current; applyFs(); requestAnimationFrame(()=>goTo(i)); }
function toggleFull(){ const el = document.documentElement; if (!document.fullscreenElement){ el.requestFullscreen?.().catch(()=>{}); } else { document.exitFullscreen?.().catch(()=>{}); } }
function toggleIndex(){ $("index").hidden = !$("index").hidden; }

document.addEventListener("keydown", e => {
  if (e.target.closest && e.target.closest("input,textarea")) return;
  const k = e.key;
  if (k === " " || k === "Spacebar"){ e.preventDefault(); setPlaying(!playing); }
  else if (k === "ArrowUp"){ e.preventDefault(); faster(1); }
  else if (k === "ArrowDown"){ e.preventDefault(); faster(-1); }
  else if (k === "+" || k === "="){ e.preventDefault(); bigger(4); }
  else if (k === "-" || k === "_"){ e.preventDefault(); bigger(-4); }
  else if (k === "PageDown" || k === "ArrowLeft"){ e.preventDefault(); goTo(current+1); }
  else if (k === "PageUp" || k === "ArrowRight"){ e.preventDefault(); goTo(current-1); }
  else if (k === "Home"){ e.preventDefault(); goTo(0); }
  else if (k.toLowerCase() === "m" || k === "צ"){ mirror = !mirror; $("viewport").classList.toggle("mirror", mirror); }
  else if (k.toLowerCase() === "f" || k === "כ"){ toggleFull(); }
  else if (k.toLowerCase() === "i" || k === "ן"){ toggleIndex(); }
  else if (k === "Escape"){ $("index").hidden = true; }

const click = (id, fn) => $(id).addEventListener("click", e => { fn(); e.currentTarget.blur(); });
click("bPlay", () => setPlaying(!playing));
click("bFast", () => faster(1)); click("bSlow", () => faster(-1));
click("bBigger", () => bigger(4)); click("bSmaller", () => bigger(-4));
click("bNext", () => goTo(current+1)); click("bPrev", () => goTo(current-1));
click("bMirror", () => { mirror = !mirror; $("viewport").classList.toggle("mirror", mirror); });
click("bFull", toggleFull); click("bIndex", toggleIndex);
$("index").addEventListener("click", e => { const b = e.target.closest("button"); if (b){ goTo(+b.dataset.i); $("index").hidden = true; } });
$("text").addEventListener("dblclick", () => setPlaying(!playing));

// keep screen awake while presenting (optional)
let wake = null;
async function keepAwake(){ try { wake = await navigator.wakeLock?.request("screen"); } catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") keepAwake(); });
keepAwake();

applyFs(); detect(); requestAnimationFrame(tick);
</script>
