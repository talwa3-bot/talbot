<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>משוב מפקד הטקס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: form column on the right, live A4 replica of the paper form on the left (stacks on phones). */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --fg: #141b2d;
  --muted: #5b6478;
  --line: #d7dce6;
  --accent: #0038b8;
  --accent-soft: #e3eafb;
  --on-accent: #ffffff;
  --danger: #b42318;
  --font-ui: "Assistant", "Segoe UI", Arial, sans-serif;
  --font-doc: "Arimo", Arial, "Liberation Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #171e2f; --fg: #e8ecf5; --muted: #9aa4ba; --line: #2b3550;
    --accent: #7d9cff; --accent-soft: #1f2a4a; --on-accent: #0b1020; --danger: #ff8a7a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #171e2f; --fg: #e8ecf5; --muted: #9aa4ba; --line: #2b3550;
  --accent: #7d9cff; --accent-soft: #1f2a4a; --on-accent: #0b1020; --danger: #ff8a7a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 16px; }
.app { padding-inline: 16px; padding-block: 20px 110px; max-width: 1400px; margin: 0 auto; }
header.top { display: flex; flex-direction: column; gap: 4px; margin-bottom: 18px; }
header.top h1 { margin: 0; font-size: 1.6rem; font-weight: 800; text-wrap: balance; }
header.top p { margin: 0; color: var(--muted); }
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Form */
.form { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.panel h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
.eyebrow { font-size: .8rem; letter-spacing: .04em; color: var(--muted); font-weight: 700; }
label.fld { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: .95rem; }
input[type="text"], input[type="number"], textarea {
  font: inherit; font-weight: 400; color: var(--fg); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; width: 100%;
}
textarea { resize: vertical; min-height: 44px; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.row-title { font-weight: 700; font-size: 1rem; }
.row-title small { font-weight: 400; color: var(--muted); font-size: .9rem; }
.row-num { color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; flex: none; }
.controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.ctl { display: flex; align-items: center; gap: 8px; }
.ctl > span { font-size: .85rem; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  font: inherit; font-weight: 700; min-width: 40px; height: 38px; padding: 0 10px;
  border: 0; border-inline-start: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.seg button:first-child { border-inline-start: 0; }
.seg button:hover { background: var(--accent-soft); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.amb { width: 90px !important; }

/* Preview */
.preview { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.preview .cap { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .9rem; }
.stage { width: 100%; overflow: hidden; border-radius: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.10); background: #fff; }
.stage-inner { width: 794px; transform-origin: top right; }
@media (max-width: 900px) { .preview { position: static; } }

/* Action bar */
.bar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 5;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap;
}
.btn { font: inherit; font-weight: 700; border-radius: 8px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.danger { color: var(--danger); border-color: var(--danger); }
.btn:disabled { opacity: .6; cursor: progress; }
.status { font-size: .9rem; color: var(--muted); min-height: 1.2em; }

/* ===== The paper sheet (always white paper, fixed A4 width) ===== */
.sheet {
  --ink: #000000; --pen: #16348f; --rule: #000000;
  width: 794px; min-height: 1123px; background: #ffffff; color: var(--ink);
  font-family: var(--font-doc); direction: rtl; position: relative;
  padding: 40px 46px 36px 46px; font-size: 14px; line-height: 1.3;
}
.sheet .flag { position: absolute; left: 16px; top: 30px; width: 112px; height: 250px; }
.sheet .s-title { text-align: center; font-weight: 700; font-size: 17px; margin: 0 0 18px; }
.sheet .s-sub { text-align: center; font-weight: 700; font-size: 17px; text-decoration: underline; margin: 0 0 18px; }
.sheet .s-fields { display: flex; flex-direction: column; gap: 16px; margin-inline-end: 100px; margin-bottom: 40px; }
.sheet .s-field { display: flex; align-items: flex-end; gap: 6px; font-weight: 700; font-size: 15px; }
.sheet .s-field b { white-space: nowrap; }
.sheet .s-fill { flex: 1; border-bottom: 1px solid var(--rule); min-height: 20px; padding: 0 8px 1px; color: var(--pen); font-weight: 400; text-align: center; }
.sheet table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.sheet th, .sheet td { border: 1.5px solid var(--rule); padding: 6px 8px; vertical-align: middle; }
.sheet thead th { font-weight: 700; font-size: 14px; height: 70px; }
.sheet thead th.p { text-align: right; padding-right: 14px; vertical-align: top; padding-top: 22px; }
.sheet thead th.notes-h { text-align: right; vertical-align: top; padding-top: 22px; padding-right: 12px; }
.sheet td.p { font-size: 14px; height: 44px; }
.sheet td.p b { font-weight: 700; }
.sheet td.c { text-align: center; font-weight: 700; font-size: 14px; white-space: nowrap; padding: 4px 2px; }
.sheet td.r { text-align: center; font-weight: 700; font-size: 15px; white-space: nowrap; padding: 4px 2px; }
.sheet .n { display: inline-block; width: 22px; height: 22px; line-height: 19px; text-align: center; border: 1.5px solid transparent; border-radius: 50%; margin: 0 1px; }
.sheet .n.sel, .sheet .w.sel { border-color: var(--pen); color: var(--pen); }
.sheet .w { display: inline-block; padding: 1px 3px; border: 1.5px solid transparent; border-radius: 50%; }
.sheet td.nt { font-size: 12px; text-align: right; vertical-align: top; }
.sheet td.nt .pre { color: var(--ink); }
.sheet td.nt .ans { color: var(--pen); white-space: pre-wrap; word-break: break-word; }
.sheet .amb-fill { display: inline-block; min-width: 120px; border-bottom: 1px solid var(--rule); text-align: center; color: var(--pen); font-weight: 400; }
.sheet .s-notes { margin-top: 10px; display: flex; flex-direction: column; font-size: 15px; }
.sheet .ln { display: flex; align-items: flex-end; gap: 6px; min-height: 30px; }
.sheet .ln b { white-space: nowrap; font-weight: 400; }
.sheet .ln .rule { flex: 1; border-bottom: 1px solid var(--rule); color: var(--pen); padding: 0 6px 1px; min-height: 22px; white-space: nowrap; overflow: hidden; }
.sheet .gap { height: 16px; }
.sheet .ln.short-a .rule { margin-right: 100px; }
.sheet .ln.short-b .rule { margin-right: 10px; margin-left: 260px; }
.sheet .ln.short-c .rule { margin-left: 0; margin-right: 260px; }

.shot { position: fixed; inset: 0; z-index: 10; background: rgba(10, 14, 25, .6); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; }
.shot-box { background: var(--surface); color: var(--fg); border-radius: 10px; padding: 16px; width: 100%; max-width: 820px; display: flex; flex-direction: column; gap: 10px; }
.shot-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.shot-box p { margin: 0; color: var(--muted); }
.shot-box img { width: 100%; height: auto; border: 1px solid var(--line); background: #fff; -webkit-touch-callout: default; user-select: auto; }
@media print {
  @page { size: A4; margin: 0; }
  body { background: #fff; }
  .app > header, .form, .bar, .preview .cap, .shot { display: none !important; }
  .app { padding: 0; }
  .grid { display: block; }
  .stage { box-shadow: none; border-radius: 0; height: auto !important; }
  .stage-inner { transform: none !important; }
}
@media (prefers-reduced-motion: no-preference) { .seg button { transition: background-color .12s; } }
</style>

<div class="app" dir="rtl" lang="he">
  <header class="top">
    <h1>משוב מפקד הטקס</h1>
    <p>יום הזיכרון לחללי מערכות ישראל התשפ"ו 2026. ממלאים את הטופס, והמסמך משמאל מתעדכן כמו על הנייר.</p>
  </header>

  <div class="grid">
    <form class="form" id="form" autocomplete="off">
      <section class="panel">
        <span class="eyebrow">פרטי הטקס</span>
        <label class="fld">שם מפקד הטקס ודרגה
          <input type="text" id="f-commander" data-key="commander">
        </label>
        <label class="fld">שם בית העלמין
          <input type="text" id="f-cemetery" data-key="cemetery">
        </label>
        <label class="fld">כמות משתתפים משוערת שנכחו בבית העלמין
          <input type="text" id="f-attendance" data-key="attendance" inputmode="numeric">
        </label>
        <label class="fld">אישים ונציגי מדינה שהשתתפו בטקס
          <input type="text" id="f-dignitaries" data-key="dignitaries">
        </label>
      </section>

      <div id="rows" class="form"></div>

      <section class="panel">
        <span class="eyebrow">סיכום</span>
        <label class="fld">הערות לשימור
          <textarea id="f-keep" data-key="keep" rows="2"></textarea>
        </label>
        <label class="fld">הערות לשיפור
          <textarea id="f-improve" data-key="improve" rows="3"></textarea>
        </label>
      </section>
    </form>

    <aside class="preview">
      <div class="cap"><span>תצוגת המסמך</span><span>A4</span></div>
      <div class="stage" id="stage"><div class="stage-inner" id="stageInner"></div></div>
    </aside>
  </div>
</div>

<div class="bar">
  <button type="button" class="btn primary" id="btnPdf">הורדת המסמך כ־PDF</button>
  <button type="button" class="btn" id="btnPrint" hidden>הדפסה</button>
  <button type="button" class="btn" id="btnSend" hidden>שליחה לקלוד</button>
  <button type="button" class="btn" id="btnClear">ניקוי הטופס</button>
  <button type="button" class="btn danger" id="btnClearYes" hidden>כן, למחוק הכול</button>
  <button type="button" class="btn" id="btnClearNo" hidden>ביטול</button>
  <span class="status" id="status" role="status"></span>
</div>

<div class="shot" id="shot" hidden>
  <div class="shot-box">
    <div class="shot-head">
      <strong>המסמך שלך מוכן</strong>
      <button type="button" class="btn" id="shotClose">סגירה</button>
    </div>
    <p>בטלפון: לחיצה ארוכה על התמונה ואז "שמירת תמונה". במחשב: קליק ימני ואז "שמירת תמונה בשם". מהתמונה השמורה אפשר להדפיס או לשלוח.</p>
    <img id="shotImg" alt="המסמך המלא עם התשובות">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  document.documentElement.setAttribute('dir', 'rtl');
  document.documentElement.setAttribute('lang', 'he');

  // Rows exactly as on the paper form. yn = כן/לא column, rate = 1-5 column.
  var ROWS = [
    { id: 'r1',  title: 'שיתוף פעולה עם הגורמים השונים במהלך ההתארגנות', rate: true },
    { id: 'r2',  title: 'ניקיון בית העלמין', rate: true },
    { id: 'r3',  title: 'רחבת הטקס', hint: '(נא להתייחס בהערות לתורן ודגל)', rate: true, hintGap: true },
    { id: 'r4',  title: 'האם הייתה כמות מספקת של בקבוקי שתייה', yn: true },
    { id: 'r5',  title: 'סידורי פודיום, סמל המדינה, מקומות ישיבה', rate: true },
    { id: 'r6',  title: 'זרי אבל', hint: '(נא להתייחס בהערות לכמות, שעת הגעה, מצב הזרים)', rate: true },
    { id: 'r7',  title: 'ציוד הגברה ותאורה', hint: '(נא להתייחס בהערות להתקנה, איכות השמע, כמות הרמקולים)', rate: true },
    { id: 'r8',  title: 'חנייה ודרכי גישה- האם היו מספיק מקומות חניה?', yn: true, rate: true },
    { id: 'r9',  title: 'שירותים כימיים- האם הייתה כמות מספקת?', yn: true, rate: true },
    { id: 'r10', title: 'שירותים נגישים', hint: '(נא להתייחס בהערות לניקיון ונראות)', yn: true, rate: true, pre: 'נא להתייחס לנגישות:' },
    { id: 'r11', title: 'עמדת הנגשה לבעלי מוגבלויות הייתה בולטת?', yn: true, rate: true },
    { id: 'r12', title: 'שירותי מד"א (מס\' אמבולנסים):', rate: true, amb: true },
    { id: 'r13', title: 'התרשמות ארגונית כוללת', rate: true },
    { id: 'r14', title: 'תמלול- האם נראה היטב ?', yn: true },
    { id: 'r15', title: 'הקרנה מסכים- האם מוצב במקום בולט ?', yn: true, ynSlash: true, pre: 'איכות ההקרנה:' }
  ];

  var STORE = 'tekes-feedback-2026';
  function blank() {
    var s = { commander: '', cemetery: '', attendance: '', dignitaries: '', keep: '', improve: '', amb: '', rows: {} };
    ROWS.forEach(function (r) { s.rows[r.id] = { yn: '', rating: 0, note: '' }; });
    return s;
  }
  var state = blank();
  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.rows) { state = Object.assign(blank(), saved); ROWS.forEach(function (r) { state.rows[r.id] = Object.assign({ yn: '', rating: 0, note: '' }, saved.rows[r.id] || {}); }); }
  } catch (e) {}
  function persist() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  // ---------- Build the form ----------
  var rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = ROWS.map(function (r, i) {
    var h = '<section class="panel" data-row="' + r.id + '">';
    h += '<div class="row-head"><div class="row-title">' + esc(r.title) + (r.hint ? ' <small>' + esc(r.hint) + '</small>' : '') + '</div><span class="row-num">' + (i + 1) + '/' + ROWS.length + '</span></div>';
    h += '<div class="controls">';
    if (r.amb) h += '<label class="ctl"><span>מספר אמבולנסים</span><input type="number" min="0" class="amb" id="f-amb" data-key="amb" inputmode="numeric"></label>';
    if (r.yn) h += '<div class="ctl"><span>כן / לא</span><div class="seg" role="group" aria-label="כן או לא">' +
      '<button type="button" data-yn="כן" id="' + r.id + '-yes">כן</button><button type="button" data-yn="לא" id="' + r.id + '-no">לא</button></div></div>';
    if (r.rate) {
      h += '<div class="ctl"><span>דירוג (1 נמוך, 5 גבוה)</span><div class="seg" role="group" aria-label="דירוג">';
      for (var n = 1; n <= 5; n++) h += '<button type="button" data-rate="' + n + '" id="' + r.id + '-r' + n + '">' + n + '</button>';
      h += '</div></div>';
    }
    h += '</div>';
    h += '<label class="fld">' + (r.pre ? esc(r.pre.replace(/:$/, '')) + ' / הערות' : 'הערות') +
      '<textarea rows="1" id="' + r.id + '-note" data-note="' + r.id + '"></textarea></label>';
    return h + '</section>';
  }).join('');

  // Fill inputs from state
  document.querySelectorAll('[data-key]').forEach(function (el) { el.value = state[el.dataset.key] || ''; });
  document.querySelectorAll('[data-note]').forEach(function (el) { el.value = state.rows[el.dataset.note].note || ''; });
  function syncButtons() {
    ROWS.forEach(function (r) {
      var sec = rowsEl.querySelector('[data-row="' + r.id + '"]'), st = state.rows[r.id];
      sec.querySelectorAll('[data-yn]').forEach(function (b) { b.setAttribute('aria-pressed', String(st.yn === b.dataset.yn)); });
      sec.querySelectorAll('[data-rate]').forEach(function (b) { b.setAttribute('aria-pressed', String(st.rating === +b.dataset.rate)); });
    });
  }

  document.getElementById('form').addEventListener('input', function (e) {
    var el = e.target;
    if (el.dataset.key) state[el.dataset.key] = el.value;
    else if (el.dataset.note) state.rows[el.dataset.note].note = el.value;
    else return;
    changed();
  });
  document.getElementById('form').addEventListener('submit', function (e) { e.preventDefault(); });
  rowsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var st = state.rows[b.closest('[data-row]').dataset.row];
    if (b.dataset.yn) st.yn = st.yn === b.dataset.yn ? '' : b.dataset.yn;          // click again to clear
    if (b.dataset.rate) st.rating = st.rating === +b.dataset.rate ? 0 : +b.dataset.rate;
    syncButtons(); changed();
  });

  // ---------- Build the paper sheet ----------
  var FLAG_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 250">' +
    '<rect x="50" y="10" width="5" height="205" fill="#9a9a9a"/><circle cx="52.5" cy="9" r="5" fill="#b8b8b8"/>' +
    '<ellipse cx="52" cy="226" rx="34" ry="11" fill="#6f6f6f"/><ellipse cx="52" cy="221" rx="30" ry="8" fill="#a5a5a5"/>' +
    '<path d="M55 16 C70 10 82 22 96 18 C104 16 108 12 110 10 L110 120 C102 128 92 124 82 128 C70 132 62 124 55 128 Z" fill="#f4f4f6" stroke="#d0d0d6" stroke-width="1"/>' +
    '<path d="M55 28 C70 22 82 34 96 30 C104 28 108 24 110 22 L110 34 C102 40 92 36 82 40 C70 44 62 36 55 40 Z" fill="#1d3f9a"/>' +
    '<path d="M55 100 C70 94 82 106 96 102 C104 100 108 96 110 94 L110 106 C102 112 92 108 82 112 C70 116 62 108 55 112 Z" fill="#1d3f9a"/>' +
    '<g transform="translate(82 70)" fill="none" stroke="#1d3f9a" stroke-width="3.2"><path d="M0 -17 L14.7 8.5 L-14.7 8.5 Z"/><path d="M0 17 L14.7 -8.5 L-14.7 -8.5 Z"/></g>' +
    '</svg>';
  var flagSrc = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(FLAG_SVG);
  function FLAGTAG() { return '<img class="flag" alt="" src="' + flagSrc + '">'; }
  // Rasterize the flag to PNG once, so the PDF renderer draws it reliably.
  (function () {
    var img = new Image();
    img.onload = function () {
      try {
        var c = document.createElement('canvas'); c.width = 336; c.height = 750;
        c.getContext('2d').drawImage(img, 0, 0, 336, 750);
        flagSrc = c.toDataURL('image/png'); renderSheet();
      } catch (e) {}
    };
    img.src = flagSrc;
  })();

  var measureCtx = document.createElement('canvas').getContext('2d');
  function wrap(text, firstWidth, width) {
    measureCtx.font = '15px Arimo, Arial, sans-serif';
    var out = [];
    String(text || '').split(/\n/).forEach(function (para) {
      var words = para.split(/\s+/).filter(Boolean), line = '';
      if (!words.length) { out.push(''); return; }
      words.forEach(function (w) {
        var max = out.length === 0 ? firstWidth : width;
        var t = line ? line + ' ' + w : w;
        if (measureCtx.measureText(t).width > max && line) { out.push(line); line = w; } else line = t;
      });
      out.push(line);
    });
    if (out.length && out[out.length - 1] === '' && !text) out = [];
    return out;
  }

  function sheetHTML() {
    var h = '<div class="sheet">' + FLAGTAG();
    h += '<div class="s-title">משוב מפקד הטקס</div>';
    h += '<div class="s-sub">יום הזיכרון לחללי מערכות ישראל התשפ"ו- 2026</div>';
    h += '<div class="s-fields">' +
      '<div class="s-field"><b>שם מפקד הטקס ודרגה:</b><span class="s-fill">' + esc(state.commander) + '</span></div>' +
      '<div class="s-field"><b>שם בית העלמין:</b><span class="s-fill">' + esc(state.cemetery) + '</span></div>' +
      '<div class="s-field"><b>כמות משתתפים משוערת שנכחו בבית העלמין:</b><span class="s-fill">' + esc(state.attendance) + '</span></div>' +
      '<div class="s-field"><b>אישים ונציגי מדינה שהשתתפו בטקס:</b><span class="s-fill">' + esc(state.dignitaries) + '</span></div>' +
      '</div>';
    h += '<table><colgroup><col style="width:44%"><col style="width:9%"><col style="width:18%"><col style="width:29%"></colgroup>';
    h += '<thead><tr><th class="p">פרמטר</th><th>כ/ל</th><th>דירוג 1-5<br><br>(1= נמוך<br>5=גבוה)</th><th class="notes-h">הערות</th></tr></thead><tbody>';
    ROWS.forEach(function (r) {
      var st = state.rows[r.id];
      var p = '<b>' + esc(r.title) + '</b>';
      if (r.amb) p = '<b>' + esc(r.title) + '</b> <span class="amb-fill">' + esc(state.amb) + '</span>';
      if (r.hint) p += (r.hintGap ? '&nbsp;&nbsp;&nbsp; ' : ' ') + esc(r.hint);
      var c = '---';
      if (r.yn) c = '<span class="w' + (st.yn === 'כן' ? ' sel' : '') + '">כן</span>' + (r.ynSlash ? '/' : '/ ') + '<span class="w' + (st.yn === 'לא' ? ' sel' : '') + '">לא</span>';
      var rt = '----';
      if (r.rate) { rt = ''; for (var n = 1; n <= 5; n++) rt += '<span class="n' + (st.rating === n ? ' sel' : '') + '">' + n + '</span>'; }
      var nt = (r.pre ? '<span class="pre">' + esc(r.pre) + '</span> ' : '') + (st.note ? '<span class="ans">' + esc(st.note) + '</span>' : '');
      h += '<tr><td class="p">' + p + '</td><td class="c">' + c + '</td><td class="r">' + rt + '</td><td class="nt">' + nt + '</td></tr>';
    });
    h += '</tbody></table>';

    // Footer ruled lines, wrapped so long text keeps flowing onto extra lines like handwriting.
    var inner = 794 - 92;
    measureCtx.font = '15px Arimo, Arial, sans-serif';
    var keepLabelW = measureCtx.measureText('הערות לשימור:').width + 20;
    var keep = wrap(state.keep, inner - keepLabelW - 120, inner - 12);
    var imp = wrap(state.improve, inner - 12, inner - 12);
    h += '<div class="s-notes">';
    h += '<div class="ln"><b>הערות לשימור:</b><span class="rule" style="margin-left:150px">' + esc(keep[0] || '') + '</span></div>';
    var keepRest = Math.max(1, keep.length - 1);
    for (var i = 0; i < keepRest; i++) h += '<div class="ln"><span class="rule">' + esc(keep[i + 1] || '') + '</span></div>';
    h += '<div class="gap"></div><div class="ln"><b>הערות לשיפור:</b></div>';
    var shapes = ['short-a', 'short-c', 'short-b'];
    var impN = Math.max(3, imp.length);
    for (var j = 0; j < impN; j++) h += '<div class="ln' + (imp[j] || j >= 3 ? '' : ' ' + shapes[j]) + '"><span class="rule">' + esc(imp[j] || '') + '</span></div>';
    h += '</div></div>';
    return h;
  }

  var stage = document.getElementById('stage'), stageInner = document.getElementById('stageInner');
  function fit() {
    var s = stage.clientWidth / 794;
    stageInner.style.transform = 'scale(' + s + ')';
    stage.style.height = (stageInner.firstChild ? stageInner.firstChild.offsetHeight * s : 1123 * s) + 'px';
  }
  function renderSheet() { stageInner.innerHTML = sheetHTML(); fit(); }
  var t;
  function changed() { renderSheet(); clearTimeout(t); t = setTimeout(persist, 250); }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(stage);

  syncButtons(); renderSheet();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderSheet);

  // ---------- PDF export ----------
  var statusEl = document.getElementById('status'), btnPdf = document.getElementById('btnPdf');
  function say(m) { statusEl.textContent = m; }
  var downloadsP = (window.claude && window.claude.use) ? window.claude.use('downloads') : Promise.resolve(null);

  async function makePdf() {
    if (!window.html2canvas || !window.jspdf) throw new Error('libs');
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    var host = document.createElement('div');
    host.style.cssText = 'position:fixed;top:0;left:-10000px;width:794px;background:#fff;';
    host.innerHTML = sheetHTML();
    document.body.appendChild(host);
    try {
      var canvas = await html2canvas(host.firstChild, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true, logging: false });
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      var w = 210, h = canvas.height * 210 / canvas.width, x = 0;
      if (h > 297) { w = 297 * canvas.width / canvas.height; h = 297; x = (210 - w) / 2; } // long answers: shrink to one page
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', x, 0, w, h);
      pdf._canvas = canvas;
      return pdf;
    } finally { host.remove(); }
  }
  function fileName() {
    var c = (state.cemetery || '').replace(/[\\/:*?"<>|]+/g, ' ').trim();
    return 'משוב מפקד הטקס' + (c ? ' - ' + c : '') + ' - יום הזיכרון 2026.pdf';
  }

  var inViewer = !!(window.claude && window.claude.use);
  var shot = document.getElementById('shot'), shotImg = document.getElementById('shotImg');
  function showImage(canvas) {
    shotImg.src = canvas.toDataURL('image/png');
    shot.hidden = false; say('');
  }
  document.getElementById('shotClose').addEventListener('click', function () { shot.hidden = true; });
  // Outside Claude (the file opened directly in a browser) printing works normally.
  var btnPrint = document.getElementById('btnPrint');
  btnPrint.hidden = inViewer;
  btnPrint.addEventListener('click', function () { window.print(); });

  btnPdf.addEventListener('click', async function () {
    btnPdf.disabled = true; say('מכין את המסמך...');
    try {
      var pdf = await makePdf();
      var dl = await downloadsP;
      if (dl) {
        try { await dl.save({ filename: fileName(), data: pdf.output('blob') }); say('המסמך נשמר.'); }
        catch (err) {
          if (err && err.code === 'declined') say('השמירה בוטלה.');
          else if (err && err.code === 'rate_limited') say('חלון שמירה כבר פתוח. נסו שוב בעוד רגע.');
          else showImage(pdf._canvas);
        }
      } else if (inViewer) { showImage(pdf._canvas); }
      else { pdf.save(fileName()); say('המסמך הורד.'); }
    } catch (e) {
      say('יצירת ה־PDF נכשלה. בדקו חיבור לאינטרנט ונסו שוב.');
    } finally { btnPdf.disabled = false; }
  });

  // ---------- Send answers to Claude (shared store Claude can read) ----------
  var btnSend = document.getElementById('btnSend');
  var dbP = (window.claude && window.claude.use) ? window.claude.use('db') : Promise.resolve(null);
  // Only the form's owner sees the send button; everyone else fills and downloads their own PDF.
  var isOwnerP = ((window.claude && window.claude.use) ? window.claude.use('user') : Promise.resolve(null))
    .then(function (u) { return !!(u && u.isOwner && u.isOwner()); }).catch(function () { return false; });
  var canSendP = Promise.all([dbP, isOwnerP]).then(function (v) { return !!v[0] && v[1]; });
  canSendP.then(function (ok) { btnSend.hidden = !ok; });
  btnSend.addEventListener('click', async function () {
    var db = await dbP; if (!db) return;
    btnSend.disabled = true; say('שולח...');
    try {
      await db.doc('responses/current').set({ answers: JSON.stringify(state), sentAt: new Date().toISOString() });
      say('התשובות נשלחו לקלוד.');
    } catch (e) { say('השליחה נכשלה. נסו שוב.'); }
    finally { btnSend.disabled = false; }
  });

  // ---------- Clear with inline confirm ----------
  var bClear = document.getElementById('btnClear'), bYes = document.getElementById('btnClearYes'), bNo = document.getElementById('btnClearNo');
  function confirmMode(on) { bClear.hidden = on; if (on) btnSend.hidden = true; else canSendP.then(function (ok) { btnSend.hidden = !ok; }); bYes.hidden = !on; bNo.hidden = !on; btnPdf.hidden = on; say(on ? 'למחוק את כל התשובות?' : ''); }
  bClear.addEventListener('click', function () { confirmMode(true); });
  bNo.addEventListener('click', function () { confirmMode(false); });
  bYes.addEventListener('click', function () {
    state = blank(); persist();
    document.querySelectorAll('[data-key],[data-note]').forEach(function (el) { el.value = ''; });
    syncButtons(); renderSheet(); confirmMode(false); say('הטופס נוקה.');
  });
})();
</script>

</body>
